# Remove vui.vegas0250.ru from the combined tool server blocks first.
server {
    listen 80;
    server_name vui.vegas0250.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name vui.vegas0250.ru;
    ssl_certificate /etc/letsencrypt/live/vegas0250-tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vegas0250-tools/privkey.pem;
    root /var/www/vui/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
    location = /vui { return 308 /$is_args$args; }
    location = /vui-docs/index.html { return 308 /$is_args$args; }
}
